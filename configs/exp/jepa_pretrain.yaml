batch_size: 1 # 8
device_id: 0
num_workers: 1
prefetch_factor: 8

max_epochs: 50

lr: 0.0001 # 0.0001
weight_decay: 0.0001

milestones: [10, 20, 30, 40]
gamma: 0.5

clip_grad_value: 5
accumulation_steps: 8

save_freq: 10
model_param_filename: "jepa_pretrain_parameters.pt"

train_mode: pretrain

# ------------------------------------------------------------
# JEPA alignment + SIGReg
# ------------------------------------------------------------
jepa_sigreg_alpha: 0.05 # 0.05
jepa_num_points: 75 # 65
jepa_num_slices: 128 # 64

# Ey is generated by the EMA target encoder and must not
# participate in gradient backpropagation.
jepa_detach_target: true

# The EMA target branch cannot receive gradients, so applying
# SIGReg to target would only change the displayed loss value.
jepa_reg_on: pred

# ------------------------------------------------------------
# EMA target encoder
# ------------------------------------------------------------
jepa_ema_momentum_start: 0.999 # 0.999
jepa_ema_momentum_end: 1.0