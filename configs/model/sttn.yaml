_target_: src.models.spatiotemporal.sttn.STTN
graph_transform:
  _target_: src.graph.DoubleTransition   # forward and backward random walks, as in LargeST
  self_loops: false          # as in LargeST, no self-loops are added to the graph
hidden_channels: 128
end_channels: 512        # width of the hidden layer of the output head
blocks: 2                # spatial + temporal transformer blocks
layers_per_block: 1      # transformer layers in each spatial / temporal transformer
heads: 4                 # attention heads
mlp_expand: 2            # feed-forward width = mlp_expand * hidden_channels
diffusion_steps: 2       # powers of each support used by the graph convolution
dropout: 0.1
