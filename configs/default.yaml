# Supervised forecasting (src/experiments/main.py).
hydra:
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.override_dirname}

defaults:
  - _self_
  - dataset: pems04
  - model: gwnet
  - task: short
  - train: default
  - time_encoding: cyclic   # shared by all models, see src/models/time_encoding.py
  - predictor: default      # JEPA latent predictor, shared by all models
  - optional model_task: ${model}_${task}   # e.g. configs/model_task/patchtst_long.yaml

data_root: ~/datasets   # unified-format datasets, see tools/convert_datasets.py
seed: 2026
