batch_size: 8
device_id: 0

num_workers: 8
prefetch_factor: 2

max_epochs: 50

lr: 0.0005
weight_decay: 0.0001

milestones: [10, 20, 30, 40]
gamma: 0.5

clip_grad_value: 5

# 注意：
# InfoNCE 的负样本数量由真实 batch_size 决定。
# 梯度累积不会增加负样本数量。
accumulation_steps: 1

save_freq: 10

train_mode: pretrain

model_param_filename: "contrastive_pretrain_parameters.pt"

# ============================================================
# Contrastive learning
# ============================================================

# InfoNCE temperature
contrastive_temperature: 0.2

# 随机屏蔽 20% 的频率分量
contrastive_freq_mask_ratio: 0.2

# 保留直流分量，避免整体均值发生过强变化
contrastive_preserve_dc: true